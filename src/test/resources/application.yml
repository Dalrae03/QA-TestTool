spring:
  datasource:
    url: jdbc:h2:mem:tms;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

tms:
  upload:
    dir: ${java.io.tmpdir}/tms-test-uploads

jira:
  base-url:
  email:
  api-token:
  project-key:
